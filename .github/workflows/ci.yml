# Pull request checks: the pre-commit checklist from .claude/CLAUDE.md, the test suite on Linux,
# Windows, and macOS (x86_64 Linux, x86_64 Windows, arm64 macOS; the release's aarch64 Linux and
# x86_64 macOS builds are compiled but not tested), and the rendered audit reports (summary and
# full) as a downloadable artifact, the release scripts' tests, and, on a release pull request,
# a check that its branch names the Cargo.toml version.
#
# release.yml also calls this workflow, so a tag publishes only after these checks pass on the
# tagged commit, and the release reuses the audit reports rendered here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TYPST_VERSION: 0.14.2

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    env:
      # Turn every compiler warning into an error, and make the Typst template parity tests
      # fail instead of skipping when `typst` is missing.
      RUSTFLAGS: -D warnings
      REQUIRE_TYPST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ env.TYPST_VERSION }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      # Fails when claims.json was edited outside claims-mcp (issue #9).
      - name: verify catalog integrity seals
        run: cargo run --locked --quiet -- verify
      # The docs site's claims viewer: unit tests, plus a check that it counts this repository's
      # active claims the same way claims-mcp does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: claims viewer tests
        run: |
          cargo run --locked --quiet -- tldr --json > target/tldr.json
          CLAIMS_TLDR_JSON=target/tldr.json node --test 'docs/site/viewer-tests/*.test.mjs'

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Typst parity tests run in `check`; here they skip, since they do not depend on
      # the platform.
      - run: cargo test --locked

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  release-scripts:
    name: release scripts
    runs-on: ubuntu-latest
    env:
      # The end-to-end release test runs the real cargo-release; fail rather than skip it.
      REQUIRE_CARGO_RELEASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-release@0.25.18
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: shellcheck -x scripts/*.sh
      - run: just release-test

  # A release pull request (`just release-ship` opens it from `release/vX.Y.Z`) must carry that
  # version in Cargo.toml, or release.yml would refuse its tag after the merge.
  release-branch:
    name: release branch matches Cargo.toml
    if: startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/release-branch-check.sh "$HEAD_REF"

  report:
    name: audit report
    runs-on: ubuntu-latest
    steps:
      # Render from the PR head rather than the merge commit GitHub checks out by default, so
      # the report's catalog and commit stamp match what reviewers see on the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # `just report` runs `claims-mcp verify --json` for the report's integrity section.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ env.TYPST_VERSION }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just report
      - run: just report full
      - id: name
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "artifact=audit-report-${PR_NUMBER:+pr-$PR_NUMBER-}$short_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            audit.pdf
            audit-full.pdf
          if-no-files-found: error
