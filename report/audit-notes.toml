# Free-text sidecar for report/claims-report.typ (pass with --input notes=report/audit-notes.toml).
#
# SNAPSHOT: these notes record the auditor's judgment on the first self-audit of claims-mcp
# (catalog at 969620b, re-audited in PR #3). They are not a default. Rewrite the assessment and
# points whenever the catalog is re-audited. Counts, verdicts, and gaps are deliberately left
# out: the report computes those from the catalog, so prose here cannot contradict them.

artifact = "claims-mcp"
version = "0.1.0"
repository = "https://github.com/hypotheosis/claims-mcp"
method = "skills/claims-audit"

assessment = """
claims-mcp was audited against concept.md and the design spec. The server itself meets every \
audited requirement. The one refutation (CLM-0034) concerns a process artifact, not the \
server: the implementation plan no longer matches the committed source, which is tracked as \
issue #1.
"""

[[points]]
title = "Independence"
body = """
The audit was not independent: the model that produced claims-mcp also audited it. Weigh the \
verdicts accordingly and spot-check the evidence locators, starting with integrity level 4.
"""

[[points]]
title = "Test coverage versus test names"
body = """
Some tests cover less than their names suggest. Evidence summaries say what each test observed; \
read those rather than the test name.
"""

[[points]]
title = "Heuristic checks"
body = """
Some evidence comes from heuristic checks (text searches and scripted comparisons) that can \
report false positives. Their locators name the exact command so the result can be reproduced.
"""

[[points]]
title = "Hierarchy corrections"
body = """
The claim hierarchy was corrected during the audit. The catalog records the final structure; \
git history of claims.json shows the corrections.
"""
