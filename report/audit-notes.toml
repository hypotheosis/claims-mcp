# Free-text sidecar for report/claims-report.typ (pass with --input notes=report/audit-notes.toml).
#
# These are claims-mcp's own notes for its self-audit. To report on another project, start from
# report/audit-notes.example.toml instead of copying this file.
#
# SNAPSHOT: the assessment records the auditor's judgment on the first self-audit of claims-mcp
# (catalog at 969620b, re-audited in PR #3), then one fixed paragraph on what was audited since.
# It does not change per release: `just release-prepare` updates only `version`. Rewrite the
# assessment and points only when the catalog is re-audited as a whole.
# Counts, verdicts, and gaps are deliberately left out: the report computes those from the
# catalog, so prose here cannot contradict them.

artifact = "claims-mcp"
version = "0.2.5"
repository = "https://github.com/hypotheosis/claims-mcp"
method = "skills/claims-audit"

assessment = """
claims-mcp was audited against concept.md and the design spec. The server itself meets every \
audited requirement. That audit's one refutation (CLM-0034) concerned a process artifact, not \
the server: the implementation plan no longer matched the committed source. Issue #1 resolved \
it by marking the plan as historical; CLM-0034 was retired and replaced by CLM-0066.

This assessment dates from the 0.1.0 audit. Most changes from 0.2.0 to 0.2.5 were not audited \
as claims. The exceptions are CLM-0037 (the catalog schema version that integrity seals \
introduced in 0.2.0), CLM-0067 to CLM-0077 (the documentation site against the code), and \
CLM-0078 to CLM-0130 (0.2.5's per-call catalog argument and rebase command). Since 0.2.5, \
changes are audited as claims in the pull requests that make them; dependency updates are not.
"""

[[points]]
title = "Independence"
body = """
The original audit (claims through CLM-0077) was not independent: the model that produced \
claims-mcp also audited it. Weigh those verdicts accordingly and spot-check their evidence \
locators, starting with integrity level 4. The 0.2.5 claims (CLM-0078 to CLM-0130) were \
recorded by an auditor subagent on a different model, given the issue, the PR description and \
the diff but not the producer's account. It is still a model of the same family, so the same \
spot checks apply.
"""

[[points]]
title = "Test coverage versus test names"
body = """
Some tests cover less than their names suggest. Evidence summaries say what each test observed; \
read those rather than the test name.
"""

[[points]]
title = "Heuristic checks"
body = """
Some evidence comes from heuristic checks (text searches and scripted comparisons) that can \
report false positives. Their locators name the exact command so the result can be reproduced.
"""

[[points]]
title = "Hierarchy corrections"
body = """
The claim hierarchy was corrected during the audit. The catalog records the final structure; \
git history of claims.json shows the corrections.
"""
